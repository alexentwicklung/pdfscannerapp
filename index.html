<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#3b82f6">
  <title>Noten Scanner Pro</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: var(--surface);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    .status-badge {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--border);
      color: var(--text-muted);
      font-weight: 500;
    }
    .status-badge.ready { background: rgba(34,197,94,0.2); color: var(--success); }
    .status-badge.offline { background: rgba(245,158,11,0.2); color: var(--warning); }
    .main {
      flex: 1;
      overflow-y: auto;
      position: relative;
    }
    .start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
      text-align: center;
    }
    .start-screen .icon { font-size: 64px; margin-bottom: 16px; }
    .start-screen h2 { font-size: 22px; margin-bottom: 8px; }
    .start-screen p { color: var(--text-muted); margin-bottom: 32px; max-width: 280px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      max-width: 280px;
      margin-bottom: 12px;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .editor-screen { display: none; height: 100%; flex-direction: column; }
    .editor-toolbar {
      background: var(--surface);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 10px;
      overflow-x: auto;
      align-items: center;
    }
    .editor-toolbar select, .editor-toolbar button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      white-space: nowrap;
    }
    .editor-toolbar button {
      background: var(--primary);
      border: none;
      font-weight: 600;
    }
    .editor-toolbar button.danger { background: var(--danger); }
    .canvas-container {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #editorCanvas {
      max-width: 100%;
      max-height: 100%;
      touch-action: none;
    }
    .corner-hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-muted);
      pointer-events: none;
    }
    .pages-strip {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      align-items: center;
      min-height: 90px;
    }
    .page-thumb {
      position: relative;
      width: 60px;
      height: 80px;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid var(--border);
      cursor: pointer;
      flex-shrink: 0;
      background: var(--bg);
    }
    .page-thumb.active { border-color: var(--primary); }
    .page-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .page-thumb .page-num {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-size: 10px;
      background: rgba(0,0,0,0.7);
      padding: 1px 4px;
      border-radius: 3px;
    }
    .page-thumb .delete-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      background: var(--danger);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .page-thumb:hover .delete-btn { opacity: 1; }
    .add-page-btn {
      width: 60px;
      height: 80px;
      border: 2px dashed var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: var(--text-muted);
      cursor: pointer;
      flex-shrink: 0;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 100;
      flex-direction: column;
    }
    .modal-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
    }
    .modal-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .processing {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.95);
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .export-bar {
      display: none;
      padding: 12px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      gap: 10px;
    }
    .export-bar .btn { margin: 0; max-width: none; }
    #fileInput, #cameraInput { display: none; }
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ===== DEBUG PANEL ===== */
    .debug-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.92);
      border-top: 2px solid var(--danger);
      max-height: 200px;
      overflow-y: auto;
      z-index: 300;
      font-family: monospace;
      font-size: 11px;
      display: none;
      flex-direction: column;
    }
    .debug-panel.open { display: flex; }
    .debug-header {
      padding: 6px 12px;
      background: var(--danger);
      color: white;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .debug-body {
      padding: 8px 12px;
      color: #22c55e;
      line-height: 1.5;
      max-height: 160px;
      overflow-y: auto;
    }
    .debug-body .err { color: #ef4444; }
    .debug-body .warn { color: #f59e0b; }
    .debug-toggle {
      position: fixed;
      bottom: 8px;
      right: 8px;
      z-index: 301;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.7;
    }
  </style>
<base target="_blank">
</head>
<body>

  <div class="header">
    <h1>🎼 Noten Scanner</h1>
    <span class="status-badge" id="statusBadge">Lade...</span>
  </div>

  <div class="main" id="mainContainer">
    <div class="start-screen" id="startScreen">
      <div class="icon">📄</div>
      <h2>Dokument scannen</h2>
      <p>Fotografiere deine Noten, ich erkenne automatisch die Kanten und erzeuge ein sauberes PDF.</p>
      <button class="btn btn-primary" onclick="app.startCamera()">📷 Kamera öffnen</button>
      <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">🖼️ Bild auswählen</button>
      <input type="file" id="fileInput" accept="image/*" onchange="app.handleFileSelect(event)">
    </div>

    <div class="editor-screen" id="editorScreen">
      <div class="editor-toolbar">
        <select id="dinSelect" onchange="app.onDinChange()">
          <option value="auto">🎯 Auto DIN</option>
          <option value="A3">A3</option>
          <option value="A4" selected>A4</option>
          <option value="A5">A5</option>
          <option value="A6">A6</option>
        </select>
        <select id="modeSelect">
          <option value="scores">🎼 Noten-Modus</option>
          <option value="document">📄 Dokument (SW)</option>
          <option value="photo">🖼️ Foto (Farbe)</option>
        </select>
        <button onclick="app.resetCorners()">🔄 Reset</button>
        <button onclick="app.rotateImage()">↻ 90°</button>
        <button class="danger" onclick="app.cancelEdit()">✕ Abbrechen</button>
        <button onclick="app.confirmPage()">✓ Übernehmen</button>
      </div>
      <div class="canvas-container" id="canvasContainer">
        <canvas id="editorCanvas"></canvas>
        <div class="corner-hint">Ecken verschieben zum Korrigieren</div>
      </div>
    </div>
  </div>

  <div class="pages-strip" id="pagesStrip">
    <div class="add-page-btn" onclick="app.addPage()">+</div>
  </div>

  <div class="export-bar" id="exportBar">
    <button class="btn btn-primary" onclick="app.exportPDF()">💾 PDF speichern unter...</button>
    <button class="btn btn-secondary" onclick="app.clearAll()">🗑️ Alle löschen</button>
  </div>

  <div class="modal-overlay" id="previewModal">
    <div class="modal-header">
      <h3>Vorschau</h3>
      <button class="btn btn-secondary" onclick="app.closePreview()" style="width:auto;padding:8px 16px;">Schließen</button>
    </div>
    <div class="modal-content">
      <img id="previewImg" src="" alt="Preview">
    </div>
  </div>

  <div class="processing" id="processing">
    <div class="spinner"></div>
    <p id="processingText">Verarbeite...</p>
  </div>

  <!-- Debug Panel -->
  <button class="debug-toggle" onclick="app.toggleDebug()" title="Debug">🐛</button>
  <div class="debug-panel" id="debugPanel">
    <div class="debug-header" onclick="app.toggleDebug()">
      <span>Debug Log</span>
      <span>✕</span>
    </div>
    <div class="debug-body" id="debugBody">
      App gestartet...
    </div>
  </div>

  <!-- Scripts: OpenCV optional (async), pdf-lib lokal -->
  <script src="./opencv.js" async onload="app.onOpenCvReady()"></script>
  <script src="./pdf-lib.min.js"></script>
  <script src="./app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(reg => console.log('SW registriert'))
          .catch(err => console.error('SW Fehler:', err));
      });
    }
    window.addEventListener('online', () => app.updateStatus && app.updateStatus());
    window.addEventListener('offline', () => app.updateStatus && app.updateStatus());
  </script>
</body>
</html>
